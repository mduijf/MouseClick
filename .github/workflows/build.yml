name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        shell: bash
        run: echo "label=$(python -c 'from version import version_label; print(version_label())')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pip install pyinstaller pystray Pillow

      - name: Build exe
        run: pyinstaller MouseClick.spec --noconfirm

      - name: Write dist version file
        run: python write_dist_version.py

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: YellowspotMouseClick-${{ steps.version.outputs.label }}
          path: |
            dist/YellowspotMouseClick-v*.exe
            dist/version.txt
            clicks.json
